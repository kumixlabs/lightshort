name: "Checks"
description: "Setup Bun, install, lint, typecheck, build, cargo check"

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Bun cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Lint
      shell: bash
      run: bun run lint

    - name: Check Types
      shell: bash
      run: bun run types:check

    - name: Test
      shell: bash
      run: bun test

    - name: Build
      shell: bash
      run: bun run build

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Rust check
      shell: bash
      working-directory: src-tauri
      run: cargo check

    - name: Rust test
      shell: bash
      working-directory: src-tauri
      run: cargo test
